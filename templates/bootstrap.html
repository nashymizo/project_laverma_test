<!DOCTYPE html>
    <html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mein Bootstrap Test</title>
        
        <!-- HIER WIRD BOOTSTRAP AUS DEM INTERNET GELADEN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        
        <!-- Container zentriert den Inhalt und gibt ihm Ränder -->
        <div class="container mt-5">
            
            <!-- Eine vorgefertigte "Card" (Kasten) mit Schatten -->
            <div class="card shadow">
                <div class="card-body p-5 bg-light rounded">
                    
                    <!-- Typografie-Klassen von Bootstrap -->
                    <h1 class="display-5 fw-bold text-primary">Hallo Bootstrap!</h1>
                    <p class="fs-4">
                        Das ist meine erste Seite mit einem professionellen UI-Framework. 
                        Die Schriftart, die Abstände und die saubere Optik kommen alle automatisch von Bootstrap, 
                        ohne dass wir eine einzige Zeile eigenes CSS schreiben mussten.
                    </p>
                    
                    <hr class="my-4">
                    
                    <!-- Vorgefertigte Buttons -->
                    <button class="btn btn-primary btn-lg" type="button">Ein schöner blauer Button</button>
                    <button class="btn btn-outline-danger btn-lg" type="button">Ein roter Rahmen-Button</button>


                    
                </div>
            </div>
            
        </div style="position: fixed; bottom: 200px; left: 20px;">
            <a href="/">🏠 Zur Startseite</a>
        <div>


        </div>
    </body>
    </html>
